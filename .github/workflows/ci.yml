name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pip install -e .
      - run: pytest -q
      - name: Smoke-test contract CLI
        run: |
          python -m contratos_prazos.cli --data "$RUNNER_TEMP/contratos.json" add DEMO001 "Suporte técnico" "Empresa Fictícia" 2026-01-01 2027-01-01 10000 --renewal-days 30
          python -m contratos_prazos.cli --data "$RUNNER_TEMP/contratos.json" summary | grep -q "Contratos: 1"
          python -m contratos_prazos.cli --data "$RUNNER_TEMP/contratos.json" renew DEMO001 | grep -q "2027-01-31"
          python -m contratos_prazos.cli --data "$RUNNER_TEMP/contratos.json" list | grep -q "DEMO001"
